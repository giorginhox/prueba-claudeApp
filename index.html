<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mi Furgo</title>
    <meta name="description" content="Control del material de la furgoneta.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1A66D2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F2544" media="(prefers-color-scheme: dark)">
    <meta name="format-detection" content="telephone=no">

    <!-- iPhone: pantalla completa al abrirla desde la pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mi Furgo">
    <!-- Barra de la hora opaca: con «black-translucent», iOS 26 dibuja la app más corta que la
         pantalla y deja un hueco abajo (fallo de WebKit 301108). iOS lee esto al instalar la app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <!-- Pantalla de arranque: iPhone 15 Pro Max (y 14 Pro Max, 15 Plus, 16 Plus, que miden igual) -->
    <link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="css/app.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="top__bar">
        <h1 class="brand">
          <svg class="brand__van" viewBox="80 160 352 240" aria-hidden="true">
            <path d="M88 196Q88 168 116 168L292 168Q310 168 322 182L378 248L404 258Q424 266 424 288L424 336Q424 356 404 356L108 356Q88 356 88 336Z"/>
            <circle cx="160" cy="356" r="34"/>
            <circle cx="352" cy="356" r="34"/>
          </svg>
          Mi Furgo
        </h1>
        <button class="alert-pill" id="low-pill" type="button" hidden></button>
      </div>
      <form class="search" id="search-form" role="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
        <label class="visually-hidden" for="search">Buscar material</label>
        <input id="search" class="search__input" type="search" placeholder="Buscar material" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </form>
    </header>

    <nav class="filters" id="filters" aria-label="Filtrar por categoría"></nav>

    <main class="content" id="content" aria-live="polite"></main>

    <footer class="dock">
      <button class="button button--primary button--add" id="add-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Añadir material
      </button>
    </footer>

    <div class="toast" id="toast" role="status" hidden>
      <span class="toast__text" id="toast-text"></span>
      <button class="toast__action" id="toast-action" type="button" hidden></button>
    </div>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <form class="sheet__panel" id="item-form" novalidate>
        <div class="sheet__bar">
          <button class="bar-button" type="button" data-close>Cancelar</button>
          <h2 class="sheet__title" id="sheet-title">Nuevo material</h2>
          <button class="bar-button bar-button--strong" type="submit">Guardar</button>
        </div>

        <div class="sheet__body">
          <div class="field">
            <label class="field__label" for="f-name">Nombre</label>
            <input class="field__input" id="f-name" name="name" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" placeholder="Ej.: Tubo multicapa 16" aria-describedby="f-name-error">
            <p class="field__error" id="f-name-error" hidden></p>
          </div>

          <fieldset class="field">
            <legend class="field__label">Categoría</legend>
            <div class="choices" id="f-categories"></div>
            <p class="field__error" id="f-category-error" hidden></p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="f-quantity">Cantidad</label>
            <div class="stepper stepper--form">
              <button class="step" type="button" data-target="f-quantity" data-delta="-1" aria-label="Restar uno a la cantidad">−</button>
              <input class="stepper__input" id="f-quantity" name="quantity" type="text" inputmode="numeric" pattern="[0-9]*" value="0">
              <button class="step" type="button" data-target="f-quantity" data-delta="1" aria-label="Sumar uno a la cantidad">+</button>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="f-min">Mínimo</label>
            <div class="stepper stepper--form">
              <button class="step" type="button" data-target="f-min" data-delta="-1" aria-label="Restar uno al mínimo">−</button>
              <input class="stepper__input" id="f-min" name="min" type="text" inputmode="numeric" pattern="[0-9]*" value="0" aria-describedby="f-min-help">
              <button class="step" type="button" data-target="f-min" data-delta="1" aria-label="Sumar uno al mínimo">+</button>
            </div>
            <p class="field__help" id="f-min-help">Se pone en rojo cuando la cantidad baja de este número. Con 0 no avisa nunca.</p>
          </div>

          <button class="button button--primary" type="submit">Guardar</button>
          <button class="button button--danger" id="delete-button" type="button" hidden>Borrar material</button>
        </div>
      </form>
    </dialog>

    <input id="import-file" type="file" accept="application/json,.json" hidden>
  </body>
</html>
